<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PitchMate｜ピッチ練習AI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 分析ボタン（左上固定） -->
<button class="analysis-btn" onclick="openSidebar()">分析</button>

<!-- サイドバーオーバーレイ -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<!-- 分析サイドバー -->
<div class="sidebar" id="analysisSidebar">
    <div class="sidebar-header">
        <strong style="font-size:16px;">セッション分析</strong>
        <button class="btn-gray" onclick="closeSidebar()" style="padding:6px 12px;margin-top:0;">✕</button>
    </div>
    <div style="display:flex;border-bottom:1px solid #eee;">
        <button onclick="switchSidebarTab('pitch')" id="tab-pitch"
            style="flex:1;padding:10px;margin-top:0;border-radius:0;background:#eff6ff;color:#0080ff;border-bottom:2px solid #0080ff;font-size:12px;">
            ピッチ・ビジネスコンテスト
        </button>
        <button onclick="switchSidebarTab('interview')" id="tab-interview"
            style="flex:1;padding:10px;margin-top:0;border-radius:0;background:white;color:#888;border-bottom:2px solid transparent;font-size:12px;">
            就活面接
        </button>
        <button onclick="switchSidebarTab('presentation')" id="tab-presentation"
            style="flex:1;padding:10px;margin-top:0;border-radius:0;background:white;color:#888;border-bottom:2px solid transparent;font-size:12px;">
            授業・研究発表
        </button>
    </div>
        <div id="sidebarSessionList" style="padding:8px 0;"></div>
    <div id="sidebarDetail" style="padding:16px;display:none;">
        <button class="btn-gray" onclick="backToList()" style="padding:6px 14px;margin-top:0;margin-bottom:16px;">← 戻る</button>
        <div id="sessionDetailContent"></div>
    </div>
</div>

<!-- 履歴モーダル -->
<div class="history-modal" id="historyModal" onclick="if(event.target===this)closeHistory()">
    <div class="history-content">
        <div class="flex-center mb-16">
            <h2 style="font-size:18px;">練習履歴</h2>
            <button class="btn-gray" onclick="closeHistory()" style="padding:6px 14px;margin-top:0;">閉じる</button>
        </div>
        <div id="historyList"></div>
    </div>
</div>

<!-- メインコンテンツ -->
<div class="container">
    <h1>PitchMate(ピッチメイト)｜ピッチ練習AI</h1>

    <!-- STEP 1: 入力画面 -->
    <div id="step1">
        <div class="card">
        <!-- モード選択 -->
        <div style="margin-bottom:20px;">
            <label style="font-size:14px;font-weight:bold;">練習モードを選択</label>
            <div style="display:flex;gap:10px;margin-top:10px;">
                <button type="button" class="mode-btn active" onclick="selectMode('pitch')" id="mode-pitch"
                    style="flex:1;padding:12px;border-radius:8px;border:2px solid #0080ff;background:#eff6ff;color:#0080ff;font-size:13px;margin-top:0;">
                    ピッチ・<br>ビジネスコンテスト
                </button>
                <button type="button" class="mode-btn" onclick="selectMode('interview')" id="mode-interview"
                    style="flex:1;padding:12px;border-radius:8px;border:2px solid #ddd;background:white;color:#333;font-size:13px;margin-top:0;">
                    就活面接
                </button>
                <button type="button" class="mode-btn" onclick="selectMode('presentation')" id="mode-presentation"
                    style="flex:1;padding:12px;border-radius:8px;border:2px solid #ddd;background:white;color:#333;font-size:13px;margin-top:0;">
                    授業・<br>研究発表
                </button>
            </div>
        </div>

        <!-- セッション名 -->
        <div style="margin-bottom:16px;">
            <label style="font-size:14px;font-weight:bold;">練習セッション名</label>
            <div style="display:flex;gap:8px;margin-top:8px;">
                <input type="text" id="sessionName" placeholder="例：学生ビジネスコンテスト、夏インターン面接"
                    style="flex:1;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;">
                <button onclick="showHistory()" style="background:#6b7280;margin-top:0;">履歴</button>
            </div>
        </div>

        <!-- ピッチ用入力 -->
        <div id="input-pitch">
            <p style="margin-bottom:10px;font-size:14px;font-weight:bold;">発表内容を入力してください</p>
            <textarea id="pitchInput" rows="6" placeholder="例：私たちはのピッチ練習AI、ピッチメイトを開発しています..."></textarea>
        </div>

        <!-- 就活用入力 -->
        <div id="input-interview" style="display:none;">
            <div style="margin-bottom:12px;">
                <p style="margin-bottom:8px;font-size:14px;font-weight:bold;">志望業界・業種</p>
                <input type="text" id="industryInput" placeholder="例：IT・エンジニア職、食品メーカー・営業職"
                    style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:14px;">
            </div>
            <p style="margin-bottom:8px;font-size:14px;font-weight:bold;">志望理由・自己PR・ガクチカ</p>
            <textarea id="interviewInput" rows="6" placeholder="例：志望理由：〇〇に興味があり...&#10;自己PR：私の強みは...&#10;ガクチカ：学生時代にAugnovaというチームを立ち上げ..."></textarea>
        </div>

        <!-- 授業・研究発表用入力 -->
        <div id="input-presentation" style="display:none;">
            <p style="margin-bottom:10px;font-size:14px;">発表内容を入力してください</p>
            <textarea id="presentationInput" rows="6" placeholder="例：本研究ではAI用いたコーチングAI、ピッチメイトの開発について..."></textarea>
        </div>

        <!-- 難易度 -->
        <div style="margin-top:16px;margin-bottom:8px;">
            <label style="font-size:14px;font-weight:bold;">難易度を選択</label>
            <div style="display:flex;gap:16px;margin-top:8px;">
                <label style="cursor:pointer;"><input type="radio" name="difficulty" value="やさしい" checked> 🟢 やさしい</label>
                <label style="cursor:pointer;"><input type="radio" name="difficulty" value="普通"> 🟡 普通</label>
                <label style="cursor:pointer;"><input type="radio" name="difficulty" value="厳しい"> 🔴 厳しい</label>
            </div>
        </div>

        <button id="startBtn" onclick="generateQuestions()">練習開始</button>
        <p class="loading" id="loading1" style="display:none;">質問を考えています...</p>
        </div>
    </div>

    <!-- STEP 2: 質疑応答・フィードバック画面 -->
    <div id="step2" style="display:none;">
        <div class="card">
            <p class="mb-16">審査員からの質問に答えてください</p>

            <div id="questionsContainer"></div>

            <button id="feedbackBtn" onclick="getFeedback()" class="mt-20">フィードバックをもらう</button>
            <p class="loading" id="loading2" style="display:none;">フィードバックを生成しています...</p>

            <!-- 分岐選択 -->
            <div id="branchContainer" style="display:none;" class="mt-20">
                <p class="text-bold mb-12">次のステップを選んでください</p>
                <div class="branch-buttons">
                    <button class="btn-green" onclick="showSummary()">全体評価を見る</button>
                    <button class="btn-yellow" onclick="startFollowup()">追加質問に答える</button>
                </div>
            </div>

            <div id="followupContainer"></div>
            <div id="summaryContainer"></div>

            <button id="retryBtn" onclick="retry()" class="mt-16" style="display:none;">もう一度練習する</button>
        </div>
    </div>

</div>

<script src="js/app.js"></script>
</body>
</html>
